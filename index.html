<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URIEL FITNESS</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="URIEL"><meta name="theme-color" content="#0B0B0D"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0B0D;--card:#17171c;--card2:#23232b;--g:#39FF14;--t:#fff;--m:#b9b9c4;--line:#30303a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:400 17px/1.45 Heebo,-apple-system,"Segoe UI",sans-serif}
body{max-width:430px;margin:0 auto;min-height:100vh}
main{padding:14px 16px 130px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;margin:6px 0 4px;font-weight:800;line-height:1.2}
.sub{color:var(--m);font-size:15px}.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid #202028}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:32px;font-weight:800;line-height:1.1}.g{color:var(--g)}.m{color:var(--m)}.u{font-size:15px;color:var(--m);font-weight:400}
.btn{display:block;width:100%;border:0;border-radius:18px;background:var(--g);color:#000;font:800 20px Heebo,sans-serif;padding:18px;cursor:pointer;min-height:56px}
.btn:active{transform:scale(.97)}.btn.o{background:transparent;color:var(--g);border:2px solid var(--g)}.btn.s{font-size:17px;padding:14px;min-height:52px}
.bar{height:12px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:rgba(16,16,20,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--m);font:600 13px Heebo,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:52px}
nav .ic{font-size:24px}nav button.on{color:var(--g)}
.chip{display:inline-block;padding:10px 16px;border-radius:22px;background:var(--card2);color:var(--t);font:600 15px Heebo;margin:0 0 8px 6px;cursor:pointer;border:0}
.chip.on{background:var(--g);color:#000}.mg{display:inline-block;padding:3px 10px;border-radius:10px;background:#16301a;color:var(--g);font-size:14px;font-weight:600;margin-left:6px}
.vid{height:110px;border-radius:16px;background:linear-gradient(135deg,#1c241a,#0f1410);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--m);font-size:14px;margin:10px 0}.vid b{font-size:30px;color:var(--g)}
.set{display:grid;grid-template-columns:42px 1fr 1fr 52px;gap:8px;align-items:center;margin-bottom:10px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px 10px;font:700 20px Heebo;text-align:center}
input::placeholder{color:#7d7d89}.ff{text-align:right;font:600 17px Heebo;margin-bottom:10px}
.ck{width:52px;height:52px;border-radius:14px;border:2px solid #4a4a55;background:none;color:#000;font-size:26px;cursor:pointer}.ck.d{background:var(--g);border-color:var(--g)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.link{background:none;border:0;color:var(--g);font:700 16px Heebo;cursor:pointer;padding:10px 0}.link.r{color:#ff7b7b}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:430px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:in .25s}
.opt{padding:16px;border-radius:14px;background:var(--card2);margin-bottom:8px;font-weight:600;cursor:pointer}
.pr{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.pr:last-child{border:0}
.empty{color:var(--m);text-align:center;padding:14px 4px;font-size:16px}
.tag{font-size:14px;background:#2a2410;color:#ffd36b;border-radius:8px;padding:3px 9px;font-weight:600}
#rp{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#101014;border-top:2px solid var(--g);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:6}
.tm{font-size:44px;font-weight:800;text-align:center;line-height:1}.bub{max-width:88%;padding:12px 14px;border-radius:18px;margin-bottom:10px}.bub.u{background:var(--g);color:#000;margin-right:auto}.bub.c{background:var(--card2)}
.ph{position:relative}.ph img{width:100%;border-radius:12px;display:block}.ph.s img{outline:3px solid var(--g)}.ph button{position:absolute;top:4px;left:4px;border:0;border-radius:50%;width:28px;height:28px;background:rgba(0,0,0,.7);color:#fff}
</style>
</head>
<body>
<div id="screen"></div><div id="ov"></div><nav id="nav"></nav><input type="file" accept="image/*" id="fp" hidden onchange="addPh(this)">
<script>
const TABS=[["home","🏠","בית"],["train","🏋️","אימונים"],["food","🍽️","תזונה"],["prog","📈","התקדמות"],["coach","💬","מאמן"]];
const PLAN=[
{d:"יום א׳",dw:0,n:"ידיים ובטן",f:"דגש על דו ראשי ותלת ראשי",g:[["דו ראשי",[["סלסול מוט EZ",3,10],["סלסול פטישים",3,12]]],["תלת ראשי",[["פושדאון בכבל",3,12],["הרחבת תלת מעל הראש",3,12]]],["בטן",[["כיפוף בטן בכבל",3,15],["הרמות ברכיים בתלייה",3,12]]]]},
{d:"יום ג׳",dw:2,n:"גב, חזה וכתפיים",f:"בלי עבודת ידיים ישירה, לצורך התאוששות",g:[["חזה",[["לחיצת חזה בשיפוע",3,10]]],["גב",[["משיכת פולי עליון",3,10],["חתירה בכבל בישיבה",3,10]]],["כתפיים",[["לחיצת כתפיים",3,10],["הרמות צד",3,12]]]]},
{d:"יום ה׳",dw:4,n:"ידיים, בטן ורגליים",f:"נפח ידיים מופחת",g:[["רגליים",[["לחיצת רגליים",3,12],["כפיפת ברכיים שכיבה",3,12]]],["ידיים",[["סלסול משקולות בישיבה",2,12],["לחיצה צרפתית",2,12]]],["בטן",[["פלאנק",3,45],["הרמות רגליים שכיבה",3,15]]]]}];
const ALTS={"סלסול מוט EZ":["סלסול משקולות","סלסול בכבל"],"סלסול פטישים":["סלסול חבל","סלסול ריכוז"],"פושדאון בכבל":["דיפס במכונה","קיקבק"],"לחיצת חזה בשיפוע":["לחיצת חזה במכונה","פלייז כבלים"],"משיכת פולי עליון":["משיכה בגריפ צר","משיכת מכונה"],"חתירה בכבל בישיבה":["חתירת מכונה","חתירה במשקולת"],"לחיצת כתפיים":["לחיצת מכונה","הרמות קדמיות"],"הרמות צד":["הרמות צד בכבל","הרמות צד במכונה"]};
const LIB=[["דיפס במכונה","תלת ראשי"],["סלסול בכבל","דו ראשי"],["פלייז כבלים","חזה"],["הרמות אחוריות","כתפיים"],["כיפוף בטן במכונה","בטן"],["כפיפת ברכיים בישיבה","רגליים"]];
const T={p:140,k:2600};const MEALS=["ארוחת בוקר","ארוחת צהריים","ארוחת ערב","ביניים"];
const DEF=()=>({wt:[],hist:[],meals:{},saved:[],water:{},photos:[],rest:90,t:null,lb:0});
let DB=DEF(),db=null;
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open("uriel-fitness",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadDB(){db=await openDB();const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("data");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(v)Object.assign(DB,v);if(DB.t)Object.assign(T,DB.t)}
function save(){if(!db){S.dbErr=1;return}try{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(DB,"data");tx.onerror=()=>{S.dbErr=1;alert("השמירה נכשלה. צור גיבוי ובדוק מקום פנוי.")}}catch(e){S.dbErr=1;alert("השמירה נכשלה")}}
const $=id=>document.getElementById(id);
const iso=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let S={tab:"home",pl:0,met:"wt",chat:[["c","אני המאמן שלך. כרגע זו הדגמת ממשק: בגרסה האמיתית אענה לפי הנתונים שנשמרו."]],W:null,sum:null,re:0,sel:[]};
const todayMeals=()=>DB.meals[iso()]||[];
function tot(){return todayMeals().reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p}),{k:0,p:0})}
function lastOf(n){for(let i=DB.hist.length-1;i>=0;i--){const e=DB.hist[i].ex.find(x=>x.n==n);if(e&&e.sets.length)return{d:DB.hist[i].d,s:e.sets}}return null}
function bestOf(n,hist){let b=null;(hist||DB.hist).forEach(h=>h.ex.forEach(e=>{if(e.n==n)e.sets.forEach(s=>{if(!b||s.w>b.w||(s.w==b.w&&s.r>b.r))b=s})}));return b}
function ring(p){return `<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`}
function nextW(){const now=new Date(),dow=now.getDay(),done=DB.hist.some(h=>h.d==iso());for(let k=0;k<8;k++){const d=(dow+k)%7,i=PLAN.findIndex(p=>p.dw==d);if(i>=0&&!(k==0&&done))return{i,k}}}
function nav(){$("nav").style.display=(S.W||S.sum)?"none":"flex";$("nav").innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("")}
function go(t){S.tab=t;S.W=null;S.sum=null;clearInterval(RT);S.re=0;R()}
function home(){const n=nextW(),p=PLAN[n.i],t=tot(),lw=DB.wt.filter(x=>x.w).slice(-1)[0],now=new Date(),st=new Date(now);st.setDate(now.getDate()-now.getDay());
const days=[...Array(7)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);return{l:"אבגדהוש"[i],ok:DB.hist.some(h=>h.d==iso(d)),td:i==now.getDay()}}),cnt=days.filter(d=>d.ok).length;
return `<main><div class="row"><div><div class="sub">שלום וברוך הבא</div><h1>היי אוריאל 👋</h1></div><button class="link" style="font-size:30px" onclick="S.tab='set';R()">⚙️</button></div>${S.dbErr?'<div class="card" style="border-color:#ff7b7b">⚠️ השמירה הקבועה לא זמינה כאן. נתונים לא יישמרו אחרי סגירה.</div>':''}
<div class="card" style="border-color:var(--g)"><div class="sub">האימון הבא · ${n.k==0?'היום':n.k==1?'מחר':p.d}</div><div class="row"><div><div style="font-weight:800;font-size:23px">${p.n}</div><div class="sub">${p.g.map(x=>x[0]).join(" · ")}</div></div><span style="font-size:38px">💪</span></div><button class="btn" style="margin-top:14px" onclick="start(${n.i})">התחל אימון</button></div>
<div class="grid"><div class="card"><div class="sub">${lw?'משקל נוכחי':'משקל התחלתי'}</div><div class="big">${lw?lw.w:78} <span class="u">ק״ג</span></div></div><div class="card"><div class="sub">אימונים השבוע</div><div class="big g">${cnt}<span class="m">/3</span></div></div></div>
<div class="card"><div class="row"><b>חלבון</b><span><b class="g">${t.p}</b> / ${T.p} ג׳</span></div>${ring(t.p/T.p*100)}<div class="row" style="margin-top:16px"><b>קלוריות</b><span><b class="g">${t.k}</b> / ${T.k.toLocaleString()}</span></div>${ring(t.k/T.k*100)}<div class="sub" style="margin-top:10px">יעדים מוצעים, ייערכו בהמשך. הנתונים נספרים מהארוחות שתוסיף.</div></div>
<div class="card"><b>התקדמות שבועית</b><div class="row" style="margin-top:12px">${days.map(d=>`<div style="text-align:center"><div style="width:38px;height:38px;border-radius:50%;background:${d.ok?'var(--g)':'var(--card2)'};color:#000;line-height:38px;font-weight:800;${d.td?'outline:2px solid #fff':''}">${d.ok?'✓':''}</div><div class="m" style="font-size:14px;margin-top:4px">${d.l}</div></div>`).join("")}</div></div>
<div class="sub">יעד: גוף שרירי, ידיים גדולות ובטן חטובה</div></main>`}
function train(){const n=nextW().i;return `<main><h1>אימונים</h1><div class="sub">3 ימים בשבוע, מחולקים להתאוששות מיטבית</div><div style="height:12px"></div>
${PLAN.map((p,i)=>`<div class="card" style="${S.pl==i?'border-color:var(--g)':''}" onclick="S.pl=${i};R()"><div class="row"><div><div class="g" style="font-weight:800">${p.d}${i==n?' · הבא':''}</div><div style="font-weight:800;font-size:22px">${p.n}</div><div class="sub">${p.f}</div></div><span class="m">${p.g.reduce((a,x)=>a+x[1].length,0)} תרגילים</span></div>
${S.pl==i?`<div style="margin-top:12px">${p.g.map(x=>`<div style="margin-top:10px"><span class="mg">${x[0]}</span>${x[1].map(e=>`<div class="pr"><span>${e[0]}</span><span class="m">${e[1]}×${e[2]}</span></div>`).join("")}</div>`).join("")}<button class="btn" style="margin-top:16px" onclick="event.stopPropagation();start(${i})">התחל את האימון</button></div>`:`<div style="margin-top:10px">${p.g.map(x=>`<span class="mg">${x[0]}</span>`).join("")}</div>`}</div>`).join("")}</main>`}
function start(i){const p=PLAN[i],ex=[];p.g.forEach(g=>g[1].forEach(e=>ex.push({n:e[0],m:g[0],sets:[...Array(e[1])].map(()=>({w:"",r:"",d:false}))})));S.W={i,n:p.n,ex,c:0,t:Date.now()};R()}
function work(){const W=S.W,e=W.ex[W.c],L=lastOf(e.n);
return `<main style="padding-bottom:230px"><div class="top"><button class="link r" onclick="if(confirm('לצאת מהאימון בלי לשמור?'))go('home')">יציאה</button><b>${W.n}</b><button class="link" onclick="finish()">סיום</button></div>
<div class="bar" style="margin-top:0"><i style="width:${W.c/W.ex.length*100}%"></i></div><div class="sub" style="margin-top:6px">תרגיל ${W.c+1} מתוך ${W.ex.length}</div>
<h1>${e.n}</h1><span class="mg">${e.m}</span><div class="vid"><b>▶</b>https://www.youtube.com/embed/OT3Eiti6gc (יתחבר בשלב האימונים)</div>
<div class="card" style="background:#10200f"><div class="sub">פעם קודמת</div>${L?`<div style="font-weight:700;font-size:18px">${L.s.map(s=>s.w+"×"+s.r).join("  ·  ")}</div>`:`<div class="m">עדיין לא בוצע, אין נתוני השוואה</div>`}</div>
<div class="card"><div class="set m" style="font-size:14px"><span>סט</span><span style="text-align:center">משקל (ק״ג)</span><span style="text-align:center">חזרות</span><span></span></div>
${e.sets.map((s,j)=>{const l=L&&(L.s[j]||L.s[L.s.length-1]);return `<div class="set"><b style="font-size:20px">${j+1}</b><input type="number" inputmode="decimal" value="${s.w}" placeholder="${l?l.w:'0'}" onchange="W2(${j},'w',this.value)"><input type="number" inputmode="numeric" value="${s.r}" placeholder="${l?l.r:'0'}" onchange="W2(${j},'r',this.value)"><button class="ck ${s.d?'d':''}" onclick="tick(${j})">✓</button></div>`}).join("")}
<button class="link" onclick="S.W.ex[S.W.c].sets.push({w:'',r:'',d:false});R()">+ הוסף סט</button></div>
<div class="grid"><button class="btn o s" onclick="swap()">🔄 החלף תרגיל</button><button class="btn o s" onclick="addEx()">+ הוסף תרגיל</button></div>
<div class="row" style="margin:6px 0 14px"><button class="link r" onclick="rem()">הסר תרגיל</button></div>
<div class="grid"><button class="btn o s" onclick="if(S.W.c>0){S.W.c--;R()}">הקודם</button><button class="btn s" onclick="nx()">${W.c==W.ex.length-1?'סיים אימון':'התרגיל הבא'}</button></div></main><div id="rp"></div>`}
function W2(j,k,v){S.W.ex[S.W.c].sets[j][k]=v}
function tick(j){const s=S.W.ex[S.W.c].sets[j],L=lastOf(S.W.ex[S.W.c].n),l=L&&(L.s[j]||L.s[L.s.length-1]);if(!s.d){if(s.w===""&&l)s.w=l.w;if(s.r===""&&l)s.r=l.r}s.d=!s.d;if(s.d)startRest(DB.rest);R()}
function nx(){if(S.W.c==S.W.ex.length-1)finish();else{S.W.c++;R()}}
let RT;function startRest(s){S.re=Date.now()+s*1000;clearInterval(RT);RT=setInterval(rp,250);rp()}
function adj(d){if(S.re){S.re+=d*1000;rp()}else{DB.rest=Math.max(15,DB.rest+d);save();rp()}}
function setRest(s){DB.rest=s;save();if(S.re)startRest(s);else rp()}
function skip(){clearInterval(RT);S.re=0;rp()}
function rp(){const el=$("rp");if(!el)return;let l=S.re?Math.ceil((S.re-Date.now())/1000):0;if(S.re&&l<=0){clearInterval(RT);S.re=0;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
const run=S.re>0,v=run?l:DB.rest;
el.innerHTML=`<div class="row"><b>${run?'מנוחה':S.re===0&&l<=0&&el.dataset.done?'':'טיימר מנוחה'}</b><span class="m">ברירת מחדל: ${DB.rest} שנ׳</span></div><div class="tm ${run?'g':''}" style="margin:8px 0">${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}</div>
<div class="row" style="margin-bottom:10px"><button class="chip" onclick="adj(-15)">−15</button><button class="btn s" style="width:auto;flex:1" onclick="${run?'skip()':'startRest(DB.rest)'}">${run?'דלג על המנוחה':'התחל מנוחה'}</button><button class="chip" onclick="adj(15)">+15</button></div>
<div class="row" style="gap:4px">${[60,90,120,180].map(x=>`<button class="chip ${DB.rest==x?'on':''}" style="margin:0" onclick="setRest(${x})">${x} שנ׳</button>`).join("")}</div>`}
function sheet(h){$("ov").innerHTML=`<div class="sheet" onclick="if(event.target==this)closeS()"><div>${h}<button class="btn s" style="margin-top:14px" onclick="closeS()">סגור</button></div></div>`}
function closeS(){$("ov").innerHTML=""}
function swap(){const e=S.W.ex[S.W.c],a=ALTS[e.n]||["תרגיל חלופי א׳","תרגיל חלופי ב׳"];S.alts=a;sheet(`<b style="font-size:20px">החלפת ${e.n}</b><div style="height:10px"></div>${a.map((x,k)=>`<div class="opt" onclick="S.W.ex[S.W.c].n=S.alts[${k}];closeS();R()">${x}</div>`).join("")}`)}
